<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img" aria-label="Conjunto de ícones MOIRA">
  <title>Conjunto de ícones MOIRA</title>
  <desc>Catorze ícones de interface desenhados em notação de rede tensorial, disponíveis como símbolos reutilizáveis.</desc>

  <defs>
